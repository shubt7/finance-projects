[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ib-deal-suite"
version = "0.1.0"
description = "Investment banking deal toolkit: LBO returns, merger accretion/dilution, precedent transactions, Excel export and dashboards."
readme = "README.md"
authors = [{ name = "Shubham" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
